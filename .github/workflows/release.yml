name: Windows Build and Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare deployment directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging

          Copy-Item build/Release/DebtNote.exe staging/

      - name: Deploy Qt and compiler dependencies
        shell: pwsh
        run: |
          windeployqt `
            --release `
            --compiler-runtime `
            --sql `
            --dir staging `
            staging/DebtNote.exe

      - name: Verify deployment
        shell: pwsh
        run: |
          $requiredFiles = @(
            "staging/DebtNote.exe",
            "staging/Qt6Core.dll",
            "staging/Qt6Widgets.dll",
            "staging/platforms/qwindows.dll",
            "staging/sqldrivers/qsqlite.dll",
            "staging/vcruntime140.dll",
            "staging/vcruntime140_1.dll"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              throw "Missing deployment file: $file"
            }
          }

          Write-Host "Deployment verification passed."

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path staging/* `
            -DestinationPath DebtNote-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebtNote-windows-x64
          path: DebtNote-windows-x64.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-22.04

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: DebtNote-windows-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DebtNote-windows-x64.zip
          generate_release_notes: true
